networks:
  laravel:
    driver: bridge
  passport-web:
    external: true
    name: passport-frontend_web

services:
  app:
    restart: unless-stopped
    build:
      context: ./dockerfiles
      dockerfile: nginx.dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    # ports:
    #   - "80:80"
    #   - "443:443"
    volumes:
      - ./src:/var/www/html:delegated
      - ./certificates:/etc/nginx/ssl:ro
    depends_on:
      - php
      - mysql
      - redis
    networks:
      - laravel
      - passport-web
    container_name: laravel-nginx

  mysql:
    image: mariadb:11.0
    restart: unless-stopped
    tty: true
    ports:
      - "3329:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - laravel

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - "60"
      - "1"
      - "--loglevel"
      - "warning"
    volumes:
      - redis-data:/data
    networks:
      - laravel

  php:
    restart: unless-stopped
    build:
      context: ./dockerfiles
      dockerfile: php.root.dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    # ports:
    #     - "9000:9000"
    volumes:
      - ./src:/var/www/html:delegated
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://api.passport.et
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - laravel
    depends_on:
      - redis

  composer:
    profiles: [tools]
    build:
      context: ./dockerfiles
      dockerfile: php.dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    volumes:
      - ./src:/var/www/html
    depends_on:
      - php
    entrypoint: ["sh", "-c", 'composer "$@"', "--"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://api.passport.et
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - laravel

  npm:
    profiles: [tools]
    image: node:22-alpine
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run build && cp public/build/.vite/manifest.json public/build/manifest.json"
    networks:
      - laravel

  artisan:
    profiles: [tools]
    build:
      context: ./dockerfiles
      dockerfile: php.dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    volumes:
      - ./src:/var/www/html:delegated
    depends_on:
      - mysql
      - redis
    entrypoint: ["php", "/var/www/html/artisan"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://api.passport.et
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - laravel

  horizon:
    build:
      context: ./dockerfiles
      dockerfile: php.dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 360s
    volumes:
      - ./src:/var/www/html:delegated
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://api.passport.et
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HORIZON_QUEUES: ${HORIZON_QUEUES:-default,imports,notifications}
    networks:
      - laravel
volumes:
  redis-data:
