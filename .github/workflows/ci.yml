name: CI

on:
  push:
    branches: [ main, api ]
  pull_request:
    branches: [ main, api ]

jobs:
  deployment-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
      - name: Check deployment shell syntax and lint
        run: |
          bash -n scripts/deploy.sh
          shellcheck scripts/deploy.sh
      - name: Test deployment isolation and failures
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate production Compose configuration
        env:
          MYSQL_DATABASE: passport_test
          MYSQL_USER: passport_test
          MYSQL_PASSWORD: test_only
          MYSQL_ROOT_PASSWORD: test_only
        run: docker compose --project-name laraveldockerprod --env-file /dev/null -f docker-compose.prod.yml --profile tools config --quiet

  php-runtime-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build patched PHP images serially
        run: |
          docker build --pull -f dockerfiles/php.root.dockerfile -t passport-php-security:root dockerfiles
          docker build --pull -f dockerfiles/php.dockerfile --build-arg UID=1000 --build-arg GID=1000 -t passport-php-security:worker dockerfiles
      - name: Verify actual CLI and FPM versions in both images
        run: |
          for image in passport-php-security:root passport-php-security:worker; do
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges:true \
              --mount "type=bind,source=$GITHUB_WORKSPACE/src/scripts,target=/checks,readonly" \
              --entrypoint php "$image" /checks/check-php-runtime.php
          done

  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --add-host redis:127.0.0.1
          --health-cmd "redis-cli -p 6379 ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      mysql:
        image: mariadb:11.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_HOST: '%'
          MYSQL_DATABASE: laravel
          MARIADB_DATABASE: laravel
        ports: ['33306:3306']
        options: >-
          --add-host redis:127.0.0.1
          --health-cmd="mariadb-admin ping --protocol=tcp -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - name: Add redis host alias
        run: sudo sh -c 'echo "127.0.0.1 redis" >> /etc/hosts'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pcntl, redis, pdo_mysql
          tools: composer

      - name: Copy .env example
        run: cp src/.env.example src/.env

      - name: Install PHP dependencies
        working-directory: ./src
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Verify actual PHP platform requirements
        working-directory: ./src
        run: composer check-platform-reqs

      - name: Generate key
        working-directory: ./src
        run: php artisan key:generate

      - name: Install Node dependencies
        working-directory: ./src
        run: npm ci

      - name: Build assets
        working-directory: ./src
        run: npm run build

      - name: Run migrations
        working-directory: ./src
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 33306
          DB_DATABASE: laravel
          DB_USERNAME: root
          DB_PASSWORD: root
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan migrate --force

      - name: Run unit tests
        working-directory: ./src
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 33306
          DB_DATABASE: laravel
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test --testsuite=Unit

      - name: Run API feature tests
        working-directory: ./src
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 33306
          DB_DATABASE: laravel
          DB_USERNAME: root
          DB_PASSWORD: root
          QUEUE_CONNECTION: redis
          CACHE_STORE: redis
          SESSION_DRIVER: redis
          REDIS_CLIENT: phpredis
          REDIS_HOST: redis
          REDIS_PORT: 6379
        run: php artisan test --testsuite=Feature --filter=Api

      # - name: Static analysis (PHPStan)
      #   working-directory: ./src
      #   run: vendor/bin/phpstan analyse

      # - name: Code style (Pint)
      #   working-directory: ./src
      #   run: vendor/bin/pint --test

      - name: Horizon status check
        working-directory: ./src
        env:
          QUEUE_CONNECTION: redis
          CACHE_STORE: redis
          SESSION_DRIVER: redis
          REDIS_CLIENT: phpredis
          REDIS_HOST: redis
          REDIS_PORT: 6379
        run: php artisan horizon:status || php artisan horizon:status || true
